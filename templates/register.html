<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Controle Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-600 via-purple-600 to-pink-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/95 backdrop-blur-xl p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20">
        <div class="text-center mb-6 md:mb-8">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 w-20 h-20 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="text-4xl">💰</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                Criar Conta
            </h1>
            <p class="text-sm md:text-base text-gray-600 mt-2">Sistema de Controle Financeiro Familiar</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <div class="mb-6">
            <div class="flex border-b">
                <button onclick="showTab('criar')" id="tab-criar" class="flex-1 py-3 px-4 font-semibold border-b-2 border-blue-600 text-blue-600">
                    Criar Nova Família
                </button>
                <button onclick="showTab('entrar')" id="tab-entrar" class="flex-1 py-3 px-4 font-semibold text-gray-600">
                    Entrar em Família
                </button>
            </div>
        </div>
        
        <!-- Criar Nova Família -->
        <form method="POST" action="/register" id="form-criar">
            <input type="hidden" name="action" value="criar_familia">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nome da Família</label>
                <input type="text" name="nome_familia" required 
                       placeholder="Ex: Família Silva"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Seu Nome</label>
                <input type="text" name="nome_usuario" required 
                       placeholder="Ex: João Silva"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Usuário</label>
                <input type="text" name="username" required 
                       placeholder="Ex: joao"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input type="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                🎉 Criar Família
            </button>
            
            <p class="text-xs text-gray-600 mt-4">
                ℹ️ Você receberá um código de convite para compartilhar com sua família
            </p>
        </form>
        
        <!-- Entrar em Família Existente -->
        <form method="POST" action="/register" id="form-entrar" class="hidden">
            <input type="hidden" name="action" value="entrar_familia">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Código de Convite</label>
                <input type="text" name="codigo_convite" required 
                       placeholder="Ex: abc123xyz"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Seu Nome</label>
                <input type="text" name="nome_usuario" required 
                       placeholder="Ex: Maria Silva"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Usuário</label>
                <input type="text" name="username" required 
                       placeholder="Ex: maria"
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
                <input type="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
            </div>
            
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                👨‍👩‍👧‍👦 Entrar na Família
            </button>
            
            <p class="text-xs text-gray-600 mt-4">
                ℹ️ Peça o código de convite para quem criou a família
            </p>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/login" class="text-blue-600 hover:text-blue-800 text-sm">
                Já tem conta? Fazer login
            </a>
        </div>
    </div>
    
    <script>
        function showTab(tab) {
            const formCriar = document.getElementById('form-criar');
            const formEntrar = document.getElementById('form-entrar');
            const tabCriar = document.getElementById('tab-criar');
            const tabEntrar = document.getElementById('tab-entrar');
            
            if (tab === 'criar') {
                formCriar.classList.remove('hidden');
                formEntrar.classList.add('hidden');
                tabCriar.classList.add('border-blue-600', 'text-blue-600');
                tabCriar.classList.remove('text-gray-600');
                tabEntrar.classList.remove('border-blue-600', 'text-blue-600');
                tabEntrar.classList.add('text-gray-600');
            } else {
                formCriar.classList.add('hidden');
                formEntrar.classList.remove('hidden');
                tabEntrar.classList.add('border-blue-600', 'text-blue-600');
                tabEntrar.classList.remove('text-gray-600');
                tabCriar.classList.remove('border-blue-600', 'text-blue-600');
                tabCriar.classList.add('text-gray-600');
            }
        }
    </script>
</body>
</html>
