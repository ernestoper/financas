{% extends "base.html" %}

{% block title %}Metas por Categoria - Controle Financeiro{% endblock %}

{% block content %}
<div class="mb-6 md:mb-8">
    <div class="mb-4">
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Metas por Categoria</h2>
        <p class="text-sm md:text-base text-gray-600">Defina limites de gastos para cada categoria</p>
    </div>

    <button onclick="abrirModalMeta()"
        class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all flex items-center gap-2">
        <i class="fas fa-plus"></i> Nova Meta
    </button>
</div>

<div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-200/50">
    <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <span class="text-2xl">📋</span> Metas Definidas
    </h3>

    <div id="listaMetas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Preenchido via JS -->
        <div class="col-span-full text-center py-8 text-gray-500">
            Carregando metas...
        </div>
    </div>
</div>

<!-- Modal Nova Meta -->
<div id="modal-meta"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-4">
            🎯 Nova Meta
        </h3>
        <form id="metaForm" onsubmit="salvarMeta(event)" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📂 Categoria</label>
                <select name="categoria" required
                    class="w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all">
                    <option value="">Selecione...</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Educação">Educação</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Vestuário">Vestuário</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">💰 Valor Limite (R$)</label>
                <input type="number" name="valor_limite" step="0.01" required
                    class="w-full px-4 py-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all"
                    placeholder="0,00">
            </div>

            <div class="flex gap-4">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Salvar
                </button>
                <button type="button" onclick="fecharModalMeta()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function abrirModalMeta() {
        document.getElementById('modal-meta').classList.remove('hidden');
    }

    function fecharModalMeta() {
        document.getElementById('modal-meta').classList.add('hidden');
        document.getElementById('metaForm').reset();
    }

    async function carregarMetas() {
        const response = await fetch('/api/metas-categoria');
        const metas = await response.json();

        const container = document.getElementById('listaMetas');
        container.innerHTML = '';

        if (metas.length === 0) {
            container.innerHTML = `
                <div class="col-span-full text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                    <div class="text-4xl mb-3">🎯</div>
                    <p class="text-gray-500 font-medium">Nenhuma meta definida</p>
                    <p class="text-sm text-gray-400">Clique em "Nova Meta" para começar</p>
                </div>
            `;
            return;
        }

        metas.forEach(meta => {
            container.innerHTML += `
                <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xl">
                            ${meta.categoria.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800">${meta.categoria}</h4>
                            <p class="text-sm text-gray-500">Limite mensal</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-bold text-gray-800">${formatMoney(meta.valor_limite)}</div>
                        <button onclick="deletarMeta(${meta.id})" 
                            class="text-red-400 hover:text-red-600 text-sm hover:underline opacity-0 group-hover:opacity-100 transition-opacity">
                            Excluir
                        </button>
                    </div>
                </div>
            `;
        });
    }

    async function salvarMeta(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        const data = {
            categoria: formData.get('categoria'),
            valor_limite: parseFloat(formData.get('valor_limite'))
        };

        try {
            const response = await fetch('/api/metas-categoria', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                fecharModalMeta();
                carregarMetas();
                showToast('Meta criada com sucesso!', 'success');
            } else {
                const error = await response.json();
                showToast(error.error || 'Erro ao salvar meta', 'error');
            }
        } catch (e) {
            showToast('Erro de conexão', 'error');
        }
    }

    async function deletarMeta(id) {
        if (!confirm('Tem certeza que deseja excluir esta meta?')) return;

        try {
            const response = await fetch(`/api/metas-categoria/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                carregarMetas();
                showToast('Meta excluída!', 'success');
            } else {
                showToast('Erro ao excluir meta', 'error');
            }
        } catch (e) {
            showToast('Erro de conexão', 'error');
        }
    }

    // Carregar ao iniciar
    carregarMetas();
</script>
{% endblock %}
