{% extends "base.html" %}

{% block title %}Metas por Categoria - Controle Financeiro{% endblock %}

{% block content %}
<div class="mb-6 md:mb-8">
    <div class="mb-4">
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Metas por Categoria</h2>
        <p class="text-sm md:text-base text-gray-600">Defina limites de gastos para cada categoria</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Formulário -->
    <div class="lg:col-span-1">
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-200/50 sticky top-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="text-2xl">🎯</span> Nova Meta
            </h3>

            <form id="metaForm" onsubmit="salvarMeta(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
                    <select name="categoria" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                        <option value="">Selecione...</option>
                        <option value="Alimentação">Alimentação</option>
                        <option value="Moradia">Moradia</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Saúde">Saúde</option>
                        <option value="Educação">Educação</option>
                        <option value="Lazer">Lazer</option>
                        <option value="Vestuário">Vestuário</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Valor Limite (R$)</label>
                    <input type="number" name="valor_limite" step="0.01" required
                        class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
                        placeholder="0,00">
                </div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold py-3 rounded-xl hover:shadow-lg hover:scale-[1.02] transition-all duration-200">
                    Salvar Meta
                </button>
            </form>
        </div>
    </div>

    <!-- Lista de Metas -->
    <div class="lg:col-span-2">
        <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-gray-200/50">
            <h3 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="text-2xl">📋</span> Metas Definidas
            </h3>

            <div id="listaMetas" class="space-y-4">
                <!-- Preenchido via JS -->
                <div class="text-center py-8 text-gray-500">
                    Carregando metas...
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    async function carregarMetas() {
        const response = await fetch('/api/metas-categoria');
        const metas = await response.json();

        const container = document.getElementById('listaMetas');
        container.innerHTML = '';

        if (metas.length === 0) {
            container.innerHTML = `
                <div class="text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                    <div class="text-4xl mb-3">🎯</div>
                    <p class="text-gray-500 font-medium">Nenhuma meta definida</p>
                    <p class="text-sm text-gray-400">Crie sua primeira meta ao lado</p>
                </div>
            `;
            return;
        }

        metas.forEach(meta => {
            container.innerHTML += `
                <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-lg">
                            ${meta.categoria.charAt(0)}
                        </div>
                        <div>
                            <h4 class="font-bold text-gray-800">${meta.categoria}</h4>
                            <p class="text-sm text-gray-500">Limite mensal</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <span class="text-lg font-bold text-gray-800">${formatMoney(meta.valor_limite)}</span>
                        <button onclick="deletarMeta(${meta.id})" 
                            class="text-red-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors opacity-0 group-hover:opacity-100">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        });
    }

    async function salvarMeta(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);

        const data = {
            categoria: formData.get('categoria'),
            valor_limite: parseFloat(formData.get('valor_limite'))
        };

        try {
            const response = await fetch('/api/metas-categoria', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                form.reset();
                carregarMetas();
            } else {
                const error = await response.json();
                alert(error.error || 'Erro ao salvar meta');
            }
        } catch (e) {
            alert('Erro de conexão');
        }
    }

    async function deletarMeta(id) {
        if (!confirm('Tem certeza que deseja excluir esta meta?')) return;

        try {
            const response = await fetch(`/api/metas-categoria/${id}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                carregarMetas();
            } else {
                alert('Erro ao excluir meta');
            }
        } catch (e) {
            alert('Erro de conexão');
        }
    }

    // Carregar ao iniciar
    carregarMetas();
</script>
{% endblock %}
