{% extends "base.html" %}

{% block title %}Gastos Diários - Controle Financeiro{% endblock %}

{% block content %}
<div class="mb-6 md:mb-8">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <h2
                class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">
                🛒 Gastos Diários
            </h2>
            <p class="text-sm md:text-base text-gray-600">Registre seus gastos do dia a dia</p>
        </div>
        <button onclick="abrirModalGasto()"
            class="w-full sm:w-auto bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all flex items-center justify-center gap-2">
            <i class="fas fa-plus"></i> Novo Gasto
        </button>
    </div>
</div>

<div class="bg-white/80 backdrop-blur-sm p-4 md:p-6 rounded-2xl shadow-2xl border border-gray-200/50">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
        <h3
            class="text-lg md:text-xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent">
            📋 Gastos deste Mês
        </h3>
        <div class="text-xs md:text-sm text-gray-600">
            <span>👤 <span class="text-blue-600">Azul</span> = quem registrou</span>
        </div>
    </div>
    <div id="lista-gastos" class="space-y-2"></div>
    <div class="mt-4 pt-4 border-t">
        <p class="text-lg md:text-xl font-bold">Total: <span id="total-gastos" class="text-orange-600">R$ 0,00</span>
        </p>
    </div>
</div>

<!-- Modal Novo Gasto -->
<div id="modal-gasto"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-orange-600 to-amber-600 bg-clip-text text-transparent mb-4">
            ➕ Novo Gasto
        </h3>
        <form id="form-gasto" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📂 Categoria</label>
                <select id="categoria" required
                    class="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all">
                    <option value="">Selecione...</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Criança">Criança</option>
                    <option value="Pet">Pet</option>
                    <option value="Vestuário">Vestuário</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📝 Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Padaria, Uber" required
                    class="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">R$ Valor</label>
                    <input type="number" id="valor" placeholder="0,00" step="0.01" required
                        class="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">📅 Data</label>
                    <input type="date" id="data" required
                        class="w-full px-4 py-3 border-2 border-orange-200 rounded-xl focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-200 transition-all">
                </div>
            </div>
            <div class="flex gap-4 pt-2">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-700 hover:to-amber-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Salvar
                </button>
                <button type="button" onclick="fecharModalGasto()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('pt-BR');
    }

    function abrirModalGasto() {
        const modal = document.getElementById('modal-gasto');
        const form = document.getElementById('form-gasto');

        form.reset();
        document.getElementById('data').valueAsDate = new Date();

        modal.classList.remove('hidden');
        document.getElementById('categoria').focus();
    }

    function fecharModalGasto() {
        document.getElementById('modal-gasto').classList.add('hidden');
    }

    async function loadGastos() {
        const response = await fetch('/api/despesas-variaveis');
        const gastos = await response.json();

        const lista = document.getElementById('lista-gastos');
        lista.innerHTML = '';

        if (gastos.length === 0) {
            lista.innerHTML = `
            <div class="text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                <div class="text-6xl mb-4">🛒</div>
                <h3 class="text-xl font-bold text-gray-700 mb-2">Nenhum gasto hoje</h3>
                <p class="text-gray-500 mb-6">Registre suas compras do dia a dia aqui.</p>
                <button onclick="abrirModalGasto()" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all">
                    ➕ Novo Gasto
                </button>
            </div>
        `;
            document.getElementById('total-gastos').textContent = 'R$ 0,00';
            return;
        }

        let total = 0;
        gastos.forEach(g => {
            total += g.valor;
            lista.innerHTML += `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-all gap-3">
                <div class="flex-1">
                    <div class="font-bold text-gray-800 text-lg">${g.descricao}</div>
                    <div class="flex flex-wrap gap-2 mt-1">
                        <span class="text-xs font-medium bg-orange-100 text-orange-800 px-2 py-1 rounded-full">
                            <i class="fas fa-tag text-xs mr-1"></i>${g.categoria}
                        </span>
                        <span class="text-xs font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-full">
                            <i class="far fa-calendar text-xs mr-1"></i>${formatDate(g.data)}
                        </span>
                        <span class="text-xs font-medium bg-blue-100 text-blue-700 px-2 py-1 rounded-full">
                            👤 ${g.usuario}
                        </span>
                    </div>
                </div>
                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                    <span class="text-orange-600 font-bold text-xl">${formatMoney(g.valor)}</span>
                    <button onclick="deleteGasto(${g.id})" 
                            class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            </div>
        `;
        });

        document.getElementById('total-gastos').textContent = formatMoney(total);
    }

    document.getElementById('form-gasto').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            categoria: document.getElementById('categoria').value,
            descricao: document.getElementById('descricao').value,
            valor: parseFloat(document.getElementById('valor').value),
            data: document.getElementById('data').value
        };

        try {
            await fetch('/api/despesas-variaveis', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            showToast('Gasto registrado com sucesso!', 'success');
            fecharModalGasto();
            loadGastos();
        } catch (error) {
            showToast('Erro ao registrar gasto', 'error');
        }
    });

    async function deleteGasto(id) {
        if (confirm('Tem certeza que deseja excluir este gasto?')) {
            try {
                await fetch(`/api/despesas-variaveis/${id}`, { method: 'DELETE' });
                showToast('Gasto excluído com sucesso!', 'success');
                loadGastos();
            } catch (error) {
                showToast('Erro ao excluir gasto', 'error');
            }
        }
    }

    document.getElementById('data').valueAsDate = new Date();
    loadGastos();
</script>
{% endblock %}
