{% extends "base.html" %}

{% block title %}Receitas - Controle Financeiro{% endblock %}

{% block content %}
<div class="mb-6 md:mb-8">
    <div class="mb-4">
        <h2 class="text-2xl md:text-3xl font-bold text-gray-800">Receitas Mensais</h2>
        <p class="text-sm md:text-base text-gray-600">Gerencie suas fontes de renda</p>
    </div>
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-between items-start sm:items-center">
        <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full sm:w-auto">
            <select id="mes-select" class="px-4 py-2 border rounded focus:outline-none focus:border-blue-500">
                <option value="1">Janeiro</option>
                <option value="2">Fevereiro</option>
                <option value="3">Março</option>
                <option value="4">Abril</option>
                <option value="5">Maio</option>
                <option value="6">Junho</option>
                <option value="7">Julho</option>
                <option value="8">Agosto</option>
                <option value="9">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <select id="ano-select" class="px-4 py-2 border rounded focus:outline-none focus:border-blue-500">
                <option value="2024">2024</option>
                <option value="2025">2025</option>
                <option value="2026">2026</option>
            </select>
        </div>
        <div class="flex gap-3 w-full sm:w-auto">
            <button onclick="duplicarMesAnterior()"
                class="flex-1 sm:flex-none bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded text-sm md:text-base whitespace-nowrap transition-colors shadow-md">
                <i class="fas fa-copy mr-2"></i> Copiar Mês Anterior
            </button>
            <button onclick="abrirModalReceita()"
                class="flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm md:text-base whitespace-nowrap transition-colors shadow-md">
                <i class="fas fa-plus mr-2"></i> Nova Receita
            </button>
        </div>
    </div>
</div>

<div class="bg-white/80 backdrop-blur-sm p-4 md:p-6 rounded-2xl shadow-2xl border border-gray-200/50">
    <h3
        class="text-lg md:text-xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent mb-4">
        💵 Suas Receitas
    </h3>
    <div id="lista-receitas" class="space-y-3"></div>
    <div class="mt-4 pt-4 border-t-2 border-green-200">
        <p class="text-lg md:text-xl font-bold">Total: <span id="total-receitas" class="text-green-600">R$ 0,00</span>
        </p>
    </div>
</div>

<!-- Modal Nova/Editar Receita -->
<div id="modal-receita"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3 id="modal-titulo"
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent mb-4">
            ➕ Nova Receita
        </h3>
        <form id="form-receita" class="space-y-4">
            <input type="hidden" id="receita-id">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">💰 Descrição</label>
                <input type="text" id="descricao" placeholder="Ex: Salário, Freelance" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">R$ Valor</label>
                <input type="number" id="valor" placeholder="0,00" step="0.01" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div class="flex gap-4">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Salvar
                </button>
                <button type="button" onclick="fecharModalReceita()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let mesAtual = new Date().getMonth() + 1;
    let anoAtual = new Date().getFullYear();

    function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function abrirModalReceita(receita = null) {
        const modal = document.getElementById('modal-receita');
        const titulo = document.getElementById('modal-titulo');
        const form = document.getElementById('form-receita');

        if (receita) {
            titulo.textContent = '✏️ Editar Receita';
            document.getElementById('receita-id').value = receita.id;
            document.getElementById('descricao').value = receita.descricao;
            document.getElementById('valor').value = receita.valor;
        } else {
            titulo.textContent = '➕ Nova Receita';
            form.reset();
            document.getElementById('receita-id').value = '';
        }

        modal.classList.remove('hidden');
        document.getElementById('descricao').focus();
    }

    function fecharModalReceita() {
        document.getElementById('modal-receita').classList.add('hidden');
    }

    async function loadReceitas() {
        const mes = document.getElementById('mes-select').value;
        const ano = document.getElementById('ano-select').value;

        const response = await fetch(`/api/receitas?mes=${mes}&ano=${ano}`);
        const receitas = await response.json();

        const lista = document.getElementById('lista-receitas');
        lista.innerHTML = '';

        if (receitas.length === 0) {
            lista.innerHTML = `
            <div class="text-center py-12 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                <div class="text-6xl mb-4">💸</div>
                <h3 class="text-xl font-bold text-gray-700 mb-2">Nenhuma receita ainda</h3>
                <p class="text-gray-500 mb-6">Comece adicionando sua primeira receita deste mês!</p>
                <button onclick="abrirModalReceita()" class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all">
                    ➕ Adicionar Receita
                </button>
            </div>
        `;
            document.getElementById('total-receitas').textContent = 'R$ 0,00';
            return;
        }

        let total = 0;
        receitas.forEach(r => {
            total += r.valor;
            // Escapar aspas para passar no JSON
            const receitaJson = JSON.stringify(r).replace(/"/g, '&quot;');

            lista.innerHTML += `
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-all gap-3">
                <div class="flex-1">
                    <div class="font-bold text-gray-800 text-lg">${r.descricao}</div>
                    <span class="text-xs font-medium bg-blue-100 text-blue-700 px-2 py-1 rounded-full">👤 ${r.usuario}</span>
                </div>
                <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                    <span class="text-green-600 font-bold text-xl">${formatMoney(r.valor)}</span>
                    <div class="flex gap-2">
                        <button onclick="abrirModalReceita(${receitaJson})" 
                                class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg transition-colors" title="Editar">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteReceita(${r.id})" 
                                class="p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="Excluir">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
        });

        document.getElementById('total-receitas').textContent = formatMoney(total);
    }

    document.getElementById('form-receita').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('receita-id').value;
        const data = {
            descricao: document.getElementById('descricao').value,
            valor: parseFloat(document.getElementById('valor').value),
            mes: parseInt(document.getElementById('mes-select').value),
            ano: parseInt(document.getElementById('ano-select').value)
        };

        try {
            if (id) {
                // Atualizar
                await fetch(`/api/receitas/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                showToast('Receita atualizada com sucesso!', 'success');
            } else {
                // Criar novo
                await fetch('/api/receitas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                showToast('Receita adicionada com sucesso!', 'success');
            }

            fecharModalReceita();
            loadReceitas();
        } catch (error) {
            showToast('Erro ao salvar receita', 'error');
        }
    });

    async function deleteReceita(id) {
        if (confirm('Tem certeza que deseja excluir esta receita?')) {
            try {
                await fetch(`/api/receitas/${id}`, { method: 'DELETE' });
                showToast('Receita excluída com sucesso!', 'success');
                loadReceitas();
            } catch (error) {
                showToast('Erro ao excluir receita', 'error');
            }
        }
    }

    async function duplicarMesAnterior() {
        const mes = parseInt(document.getElementById('mes-select').value);
        const ano = parseInt(document.getElementById('ano-select').value);

        let mesOrigem = mes - 1;
        let anoOrigem = ano;

        if (mesOrigem === 0) {
            mesOrigem = 12;
            anoOrigem = ano - 1;
        }

        if (!confirm(`Copiar receitas de ${mesOrigem}/${anoOrigem} para ${mes}/${ano}?`)) {
            return;
        }

        try {
            const response = await fetch('/api/receitas/duplicar-mes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mes_origem: mesOrigem,
                    ano_origem: anoOrigem,
                    mes_destino: mes,
                    ano_destino: ano
                })
            });

            if (response.ok) {
                const data = await response.json();
                showToast(`${data.total} receitas copiadas com sucesso!`, 'success');
                loadReceitas();
            } else {
                const error = await response.json();
                showToast(error.error || 'Erro ao copiar receitas', 'error');
            }
        } catch (error) {
            showToast('Erro ao duplicar receitas', 'error');
        }
    }

    document.getElementById('mes-select').value = mesAtual;
    document.getElementById('ano-select').value = anoAtual;
    document.getElementById('mes-select').addEventListener('change', loadReceitas);
    document.getElementById('ano-select').addEventListener('change', loadReceitas);

    loadReceitas();
</script>
{% endblock %}
