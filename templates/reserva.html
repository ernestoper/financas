{% extends "base.html" %}

{% block title %}Reservas - Controle Financeiro{% endblock %}

{% block content %}
<div class="mb-6 md:mb-8">
    <h2 class="text-2xl md:text-3xl font-bold text-gray-800">💰 Minhas Reservas</h2>
    <p class="text-sm md:text-base text-gray-600">Crie e acompanhe suas metas de economia</p>
</div>

<button onclick="abrirModalNovaReserva()"
    class="mb-6 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all">
    ➕ Criar Nova Meta de Reserva
</button>

<div id="lista-goals" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Goals serão carregados aqui -->
</div>

<!-- Modal: Nova Reserva -->
<div id="modal-nova-reserva"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent mb-4">
            🎯 Nova Meta de Reserva
        </h3>
        <form id="form-nova-reserva" class="space-y-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📝 Nome da Meta</label>
                <input type="text" id="goal-nome" placeholder="Ex: Carro Novo, Escola do Filho" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">💰 Valor da Meta (R$)</label>
                <input type="number" id="goal-valor-meta" step="100" min="100" placeholder="Ex: 50000" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div class="flex gap-4">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Criar
                </button>
                <button type="button" onclick="fecharModalNovaReserva()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Depositar/Sacar -->
<div id="modal-transacao"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3 id="modal-transacao-titulo"
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent mb-4">
            💵 Transação
        </h3>
        <form id="form-transacao" class="space-y-4">
            <input type="hidden" id="transacao-goal-id">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">💰 Valor (R$)</label>
                <input type="number" id="transacao-valor" step="0.01" min="0.01" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📅 Data</label>
                <input type="date" id="transacao-data" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📝 Observação (opcional)</label>
                <input type="text" id="transacao-observacao" placeholder="Ex: Salário de Novembro"
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div class="flex gap-4">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Confirmar
                </button>
                <button type="button" onclick="fecharModalTransacao()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Editar Goal -->
<div id="modal-editar-goal"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div
        class="bg-white/95 backdrop-blur-xl p-6 md:p-8 rounded-3xl shadow-2xl max-w-md w-full border border-gray-200/50">
        <h3
            class="text-xl md:text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent mb-4">
            ✏️ Editar Meta
        </h3>
        <form id="form-editar-goal" class="space-y-4">
            <input type="hidden" id="edit-goal-id">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">📝 Nome da Meta</label>
                <input type="text" id="edit-goal-nome" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">💰 Valor da Meta (R$)</label>
                <input type="number" id="edit-goal-valor-meta" step="100" min="100" required
                    class="w-full px-4 py-3 border-2 border-green-200 rounded-xl focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-200 transition-all">
            </div>
            <div class="flex gap-4">
                <button type="submit"
                    class="flex-1 bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✓ Salvar
                </button>
                <button type="button" onclick="fecharModalEditarGoal()"
                    class="flex-1 bg-gradient-to-r from-gray-400 to-gray-500 hover:from-gray-500 hover:to-gray-600 text-white font-bold py-3 rounded-xl shadow-lg transform hover:scale-105 transition-all">
                    ✕ Cancelar
                </button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
    let tipoTransacao = 'deposito'; // 'deposito' ou 'saque'

    function formatMoney(value) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
    }

    function abrirModalNovaReserva() {
        document.getElementById('modal-nova-reserva').classList.remove('hidden');
    }

    function fecharModalNovaReserva() {
        document.getElementById('modal-nova-reserva').classList.add('hidden');
        document.getElementById('form-nova-reserva').reset();
    }

    function abrirModalTransacao(goalId, tipo) {
        tipoTransacao = tipo;
        document.getElementById('transacao-goal-id').value = goalId;
        document.getElementById('transacao-data').valueAsDate = new Date();

        const titulo = tipo === 'deposito' ? '💵 Depositar' : '💸 Sacar';
        document.getElementById('modal-transacao-titulo').textContent = titulo;

        document.getElementById('modal-transacao').classList.remove('hidden');
    }

    function fecharModalTransacao() {
        document.getElementById('modal-transacao').classList.add('hidden');
        document.getElementById('form-transacao').reset();
    }

    function abrirModalEditarGoal(goal) {
        document.getElementById('edit-goal-id').value = goal.id;
        document.getElementById('edit-goal-nome').value = goal.nome;
        document.getElementById('edit-goal-valor-meta').value = goal.valor_meta;
        document.getElementById('modal-editar-goal').classList.remove('hidden');
    }

    function fecharModalEditarGoal() {
        document.getElementById('modal-editar-goal').classList.add('hidden');
        document.getElementById('form-editar-goal').reset();
    }

    async function loadGoals() {
        const response = await fetch('/api/reserva-goals');
        const goals = await response.json();

        const lista = document.getElementById('lista-goals');
        lista.innerHTML = '';

        if (goals.length === 0) {
            lista.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <p class="text-gray-500 text-lg">📭 Nenhuma meta criada ainda</p>
                    <p class="text-gray-400 text-sm mt-2">Clique em "Criar Nova Meta" para começar!</p>
                </div>
            `;
            return;
        }

        goals.forEach(goal => {
            const percentual = goal.percentual;
            const progressColor = percentual >= 100 ? 'bg-green-500' : percentual >= 50 ? 'bg-blue-500' : 'bg-yellow-500';

            lista.innerHTML += `
                <div class="bg-white/80 backdrop-blur-sm p-6 rounded-2xl shadow-2xl border border-gray-200/50 hover:shadow-3xl transition-all">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h4 class="text-xl font-bold text-gray-800">${goal.nome}</h4>
                            <p class="text-sm text-gray-600">Meta: ${formatMoney(goal.valor_meta)}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='abrirModalEditarGoal(${JSON.stringify(goal)})' 
                                class="text-blue-600 hover:text-blue-800 p-2">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteGoal(${goal.id})" 
                                class="text-red-600 hover:text-red-800 p-2">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex justify-between text-sm mb-2">
                            <span class="font-bold text-gray-700">Acumulado:</span>
                            <span class="font-bold ${goal.valor_atual >= goal.valor_meta ? 'text-green-600' : 'text-blue-600'}">${formatMoney(goal.valor_atual)}</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-6 overflow-hidden">
                            <div class="${progressColor} h-6 rounded-full transition-all flex items-center justify-center text-xs font-bold text-white"
                                style="width: ${Math.min(percentual, 100)}%">
                                ${percentual.toFixed(1)}%
                            </div>
                        </div>
                    </div>
                    
                    <!-- Histórico de Transações -->
                    <div class="mb-4 max-h-48 overflow-y-auto" id="historico-${goal.id}">
                        <p class="text-xs text-gray-500 mb-2">📊 Últimas transações:</p>
                        <div class="space-y-2" id="lista-transacoes-${goal.id}">
                            <!-- Transações serão carregadas aqui -->
                        </div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="abrirModalTransacao(${goal.id}, 'deposito')"
                            class="flex-1 bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 text-white px-4 py-2 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all">
                            ➕ Depositar
                        </button>
                        <button onclick="abrirModalTransacao(${goal.id}, 'saque')"
                            class="flex-1 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white px-4 py-2 rounded-xl font-bold shadow-lg transform hover:scale-105 transition-all">
                            ➖ Sacar
                        </button>
                    </div>
                </div>
            `;

            // Carregar transações para este goal
            loadTransactions(goal.id);
        });
    }

    async function loadTransactions(goalId) {
        const response = await fetch(`/api/reserva-emergencia?goal_id=${goalId}`);
        const data = await response.json();

        const lista = document.getElementById(`lista-transacoes-${goalId}`);

        if (!data.historico || data.historico.length === 0) {
            lista.innerHTML = '<p class="text-xs text-gray-400 italic">Nenhuma transação ainda</p>';
            return;
        }

        lista.innerHTML = '';

        // Mostrar apenas as últimas 5 transações
        const transacoes = data.historico.slice(0, 5);

        transacoes.forEach(t => {
            const isDeposito = t.valor > 0;
            const valorClass = isDeposito ? 'text-green-600' : 'text-red-600';
            const icone = isDeposito ? '💰' : '💸';

            lista.innerHTML += `
                <div class="flex justify-between items-center text-xs bg-gray-50 p-2 rounded">
                    <div class="flex-1">
                        <span class="font-medium">${icone} ${formatMoney(Math.abs(t.valor))}</span>
                        <span class="text-gray-500 ml-2">${formatDate(t.data)}</span>
                        <div class="text-blue-600">👤 ${t.usuario}</div>
                    </div>
                </div>
            `;
        });
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    }

    async function deleteGoal(id) {
        if (!confirm('Tem certeza que deseja excluir esta meta? Todas as transações associadas serão removidas.')) {
            return;
        }

        await fetch(`/api/reserva-goals/${id}`, {
            method: 'DELETE'
        });

        loadGoals();
        alert('Meta excluída com sucesso!');
    }

    document.getElementById('form-nova-reserva').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            nome: document.getElementById('goal-nome').value,
            valor_meta: parseFloat(document.getElementById('goal-valor-meta').value)
        };

        await fetch('/api/reserva-goals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        fecharModalNovaReserva();
        loadGoals();
        alert('Meta criada com sucesso! 🎯');
    });

    document.getElementById('form-transacao').addEventListener('submit', async (e) => {
        e.preventDefault();

        let valor = parseFloat(document.getElementById('transacao-valor').value);

        // Se for saque, tornar o valor negativo
        if (tipoTransacao === 'saque') {
            valor = -Math.abs(valor);
        }

        const data = {
            valor: valor,
            data: document.getElementById('transacao-data').value,
            observacao: document.getElementById('transacao-observacao').value,
            goal_id: parseInt(document.getElementById('transacao-goal-id').value)
        };

        await fetch('/api/reserva-emergencia', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        fecharModalTransacao();
        loadGoals();

        const msg = tipoTransacao === 'deposito' ? 'Depósito realizado! 🎉' : 'Saque realizado! 💸';
        alert(msg);
    });

    document.getElementById('form-editar-goal').addEventListener('submit', async (e) => {
        e.preventDefault();

        const id = document.getElementById('edit-goal-id').value;
        const data = {
            nome: document.getElementById('edit-goal-nome').value,
            valor_meta: parseFloat(document.getElementById('edit-goal-valor-meta').value)
        };

        await fetch(`/api/reserva-goals/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        fecharModalEditarGoal();
        loadGoals();
        alert('Meta atualizada com sucesso! ✓');
    });

    loadGoals();
</script>
{% endblock %}
